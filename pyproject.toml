[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dijkstra-link-state"
version = "1.0.0"
description = "Projet universitaire Dijkstra et Link-State"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dijkstra-v1 = "dijkstra.v1:main"
dijkstra-v2 = "dijkstra.v2:main"
dijkstra-v3 = "dijkstra.v3:main"

[tool.setuptools.packages.find]
include = ["dijkstra*"]

[tool.setuptools.package-data]
"dijkstra.visual" = ["static/*.html", "static/*.css", "static/*.js"]
