name: dijkstra-link-state

x-program: &program
  image: dijkstra-link-state:local
  build:
    context: .
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  volumes:
    - ./outputs:/app/outputs
    - ./data:/app/data:ro
    - ./scenarios:/app/scenarios:ro
  stdin_open: true

services:
  v3-web:
    <<: *program
    command: ["dijkstra.v3", "--web", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
  v1:
    <<: *program
    profiles: ["cli"]
    command: ["dijkstra.v1"]
  v2:
    <<: *program
    profiles: ["cli"]
    command: ["dijkstra.v2", "--topology", "data/topologie_exemple.json"]
  v3:
    <<: *program
    profiles: ["cli"]
    command: ["dijkstra.v3", "--demo"]
